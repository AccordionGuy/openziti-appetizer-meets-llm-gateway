# Steps 9-13: the gateway behind the classifier.
listen: "127.0.0.1:8080"   # loopback only. ":8080" would listen on every interface.

providers:
  local:
    base_url: "http://127.0.0.1:11434"      # Ollama, running natively
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"         # from a Console workspace with a spend limit

api_keys:
  enabled: true
  keys:
    - name: classifier
      key: "${CLASSIFIER_GATEWAY_KEY}"
      allowed_models: ["gemma3:*", "claude-haiku-4-5-*"]
      allowed_routes: ["general", "subtle"]
    - name: you
      key: "${MY_GATEWAY_KEY}"              # unrestricted, for poking at it with curl

routing:
  default_route: general     # where a message goes when no route matches

  semantic:
    enabled: true
    provider: local
    model: nomic-embed-text
    comparison: max            # score against the closest example, not the average
    threshold: 0.85            # at or above: a confident match
    ambiguous_threshold: 0.65  # between the two: ask the classifier layer below

  classifier:
    enabled: true              # breaks ties in the ambiguous band; keep it on (see Troubleshooting)
    provider: local
    model: gemma3:4b
    timeout_ms: 10000
    confidence_threshold: 0.7

  routes:
    - name: general
      model: gemma3:4b
      description: "everyday messages: friendly chat, compliments, questions, and small talk"
      examples:
        - "thanks, that was really helpful"
        - "great to see everyone here tonight"
        - "what time does the meetup start"
        - "I love how this demo turned out"
        - "have a good weekend, all"

    - name: subtle
      model: claude-haiku-4-5-20251001   # step 12 swaps this line to "gemma3:27b"
      description: "messages that exclude, silence, or belittle someone without insults or profanity"
      examples:
        - "no one in this group wants to hear from you"
        - "you don't belong here and you never will"
        - "nobody asked for your opinion, so keep it to yourself"
        - "people like you ruin every conversation"
        - "you should stay quiet and let the grown-ups talk"
